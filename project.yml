name: SmartCallerID
options:
  bundleIdPrefix: de.cleangas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "XPZKC3SLK6"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  libPhoneNumber:
    url: https://github.com/iziz/libPhoneNumber-iOS
    from: "1.2.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  SmartCallerID:
    type: application
    platform: iOS
    sources:
      - path: SmartCallerID
      - path: Shared
    dependencies:
      - package: libPhoneNumber
        product: libPhoneNumber
      - package: GRDB
        product: GRDB
      - target: CallDirectoryExtension
    info:
      path: SmartCallerID/Info.plist
      properties:
        CFBundleDisplayName: SmartCallerID
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: "SmartCallerID liest deine Kontakte, um Firmennummern zu erkennen und Durchwahlen automatisch zu identifizieren. Deine Kontakte verlassen das Gerät nie."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
        # "telephony": Call-Directory-Funktion setzt die Telefon-App voraus.
        # Verhindert Installation/Review auf iPads, wo die App nicht funktionieren kann.
        UIRequiredDeviceCapabilities:
          - arm64
          - telephony
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cleangas.smartcallerid
        CODE_SIGN_ENTITLEMENTS: SmartCallerID/SmartCallerID.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"SmartCallerID/Resources/Preview Content\""
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectoryExtension
      - path: Shared
    dependencies:
      - package: libPhoneNumber
        product: libPhoneNumber
      - package: GRDB
        product: GRDB
    info:
      path: CallDirectoryExtension/Info.plist
      properties:
        CFBundleDisplayName: SmartCallerID
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cleangas.smartcallerid.calldirectory
        CODE_SIGN_ENTITLEMENTS: CallDirectoryExtension/CallDirectoryExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # Logik-Tests kompilieren die Shared-Sourcen direkt und laufen ohne Host-App —
  # schneller und ohne Simulator-App-Launch (der Test-Runner hing sonst beim
  # Verbinden mit der Host-App).
  SmartCallerIDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SmartCallerIDTests
      - path: Shared
    dependencies:
      - package: libPhoneNumber
        product: libPhoneNumber
      - package: GRDB
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SmartCallerID:
    build:
      targets:
        SmartCallerID: all
        CallDirectoryExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmartCallerIDTests
    archive:
      config: Release
